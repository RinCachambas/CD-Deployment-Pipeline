name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      node-versions:
        required: false
        type: string
        default: '["18", "20", "22"]'
      run-lint:
        required: false
        type: boolean
        default: true
    outputs:
      build-status:
        description: "Resultado de la construcción"
        value: ${{ jobs.build.outputs.status }}

jobs:
  test-matrix:
    name: Test Node.js v${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(inputs.node-versions) }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js v${{ matrix.node }} con caché
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'   # o 'yarn' / 'pnpm' según tu proyecto

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Lint
        if: inputs.run-lint
        run: npm run lint

      - name: Ejecutar tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test-matrix
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
